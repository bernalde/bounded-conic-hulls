  name: Bounded finite conic-union hulls
  description: The boxed finite conic-union continuous hull and compact lift. Finite bounds, explicit
    dependent residual dimensions and cone hypotheses are retained. Empty branches/index sets are
    allowed; this is not a general whole-GDP ideality theorem.
