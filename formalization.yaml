status:
  scope: For a finite index type and finite real coordinate bounds, each branch is a boxed affine
    conic inverse image with its own residual dimension. Zero, convexity and closure-under-nonnegative-scaling
    hypotheses give exact equality between the continuous perspective lift projection and the convex
    hull of the branch union. Closed cone sets additionally yield compactness of the full lift and
    equality with the closed convex hull. Empty branches, empty unions and empty index types are
    retained; zero weights force copied coordinates to zero. This is a bounded single-union theorem,
    not unrestricted epigraph conversion, whole-GDP ideality, numerical performance or solver certification.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
